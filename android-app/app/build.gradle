apply plugin: 'com.android.application'

android {
    namespace 'com.nawazishali.muetpractice'
    compileSdk 34

    defaultConfig {
        applicationId 'com.nawazishali.muetpractice'
        minSdk 24
        targetSdk 34
        versionCode 16
        versionName '3.5'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// AdMob (Google Mobile Ads SDK). The manual APK build in this
// workspace links the same SDK from ~/workspace/tools/ads-sdk.
dependencies {
    implementation 'com.google.android.gms:play-services-ads:23.6.0'
}
