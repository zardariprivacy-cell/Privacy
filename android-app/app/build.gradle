apply plugin: 'com.android.application'

android {
    namespace 'com.nawazishali.muetpractice'
    compileSdk 34

    defaultConfig {
        applicationId 'com.nawazishali.muetpractice'
        minSdk 24
        targetSdk 34
        versionCode 9
        versionName '3.2'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
